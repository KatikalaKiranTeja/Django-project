{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPL Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--bg-dark:#1a1a1a;--card-dark:#242424;--text-light:#f5f5f5;--accent-orange:#ff6600}
    body{background:var(--bg-dark);color:var(--text-light);font-family:'Poppins',sans-serif}
    .navbar{background:var(--card-dark)}
    .btn-admin{background:var(--accent-orange);color:#fff;transition:transform .25s ease,box-shadow .25s ease}
    .btn-admin:hover{color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,102,0,.35)}
    .hero-bg{height:480px;object-fit:cover;filter:brightness(.55)}
    .navbar .nav-link{color:#fff!important;transition:transform .25s ease,color .25s ease}
    .navbar .nav-link:hover{color:#ffcc80!important;transform:translateY(-2px)}
    .navbar .nav-item{display:flex;align-items:center}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="{% url 'public:home' %}">IPL Management</a>
    <ul class="navbar-nav mx-auto flex-row gap-3">
      <li class="nav-item"><a class="nav-link" href="{% url 'public:home' %}"><i class="fa-solid fa-house"></i> Home</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'teams:public_list' %}"><i class="fa-solid fa-users"></i> Teams</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'players:public_list' %}"><i class="fa-solid fa-user"></i> Players</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'matches:public_list' %}"><i class="fa-solid fa-chart-line"></i> Matches</a></li>
    </ul>
    <a href="{% url 'admin_auth:login' %}" class="btn btn-admin">Admin Login</a>
  </div>
</nav>
<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner"><div class="carousel-item active"><img src="{% static '1.jpg' %}" class="d-block w-100 hero-bg" alt=""></div><div class="carousel-item"><img src="{% static '2.jpg' %}" class="d-block w-100 hero-bg" alt=""></div><div class="carousel-item"><img src="{% static '96.jpg' %}" class="d-block w-100 hero-bg" alt=""></div></div></div>
<div class="container mt-4"><h2>Welcome to IPL Management Django</h2><p>This page preserves the original flow while backend is migrated to layered Django architecture.</p></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

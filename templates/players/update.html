<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Update Player</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-dark text-white">
        <div class="container py-4" style="max-width:700px">
            <a href="{% url 'players:admin_list' %}" class="text-white">Back</a>
            <h2>Update Player</h2>
            <form method="post" enctype="multipart/form-data" action="{% url 'players:update_action' %}">
                {% csrf_token %}
                <input type="hidden" name="jerseyNumber" value="{{ player.jersey_number }}">
                <input type="hidden" name="teamCode" value="{{ player.team_code }}">
                <input class="form-control mb-2" name="playerName" value="{{ player.player_name }}" required>
                <input class="form-control mb-2" type="number" name="age" value="{{ player.age }}" required>
                <input class="form-control mb-2" name="role" value="{{ player.role }}" required>
                <input class="form-control mb-2" name="nationality" value="{{ player.nationality }}" required>
                <img src="{{ player.image_path|default:'/static/ipl.jpeg' }}" style="width:120px" class="mb-2">
                <input class="form-control mb-3" type="file" name="playerImage" accept="image/*">
                
                <button class="btn btn-primary">Save</button>
            
            </form>
        </div>
    </body>
</html>

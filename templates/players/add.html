<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body{background:#1a1a1a;color:#f5f5f5;font-family:'Poppins',sans-serif}
      .panel{background:#242424;border:1px solid #333;border-radius:14px}
      .form-label{font-weight:600}
    </style>
</head>
<body>
  <div class="container py-4" style="max-width:760px">
    <a href="{% url 'players:admin_list' %}" class="btn btn-outline-light btn-sm mb-3">Back to Players</a>
    <div class="panel p-4">
      <h2 class="mb-3">Enter Player Details</h2>
      <form method="post" enctype="multipart/form-data" action="{% url 'players:add_action' %}">
        {% csrf_token %}
        <label class="form-label" for="jerseyNumber">Jersey Number</label>
        <input id="jerseyNumber" class="form-control mb-3" type="number" name="jerseyNumber" required>

        <label class="form-label" for="playerName">Player Name</label>
        <input id="playerName" class="form-control mb-3" name="playerName" required>

        <label class="form-label" for="age">Age</label>
        <input id="age" class="form-control mb-3" type="number" name="age" required>

        <label class="form-label" for="role">Role</label>
        <input id="role" class="form-control mb-3" name="role" required>

        <label class="form-label" for="nationality">Nationality</label>
        <input id="nationality" class="form-control mb-3" name="nationality" required>

        <label class="form-label" for="teamCode">Team</label>
        <select id="teamCode" class="form-control mb-3" name="teamCode" required>
          <option value="">Select Team</option>
          {% for t in teams %}
          <option value="{{ t.team_code }}">{{ t.team_name }} ({{ t.team_code }})</option>
          {% endfor %}
        </select>

        <label class="form-label" for="playerImage">Player Photo</label>
        <input id="playerImage" class="form-control mb-4" type="file" name="playerImage" accept="image/*" required>

        <button class="btn btn-success">Save Player</button>
      </form>
    </div>
  </div>
</body>
</html>

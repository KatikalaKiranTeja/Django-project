<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Update Match</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-dark text-white">
        <div class="container py-4" style="max-width:700px">
            <a href="{% url 'matches:admin_list' %}" class="text-white">Back</a>
            <h2>Update Match</h2>
            <form method="post" action="{% url 'matches:update_action' %}">
                
                {% csrf_token %}
                
                <input type="hidden" name="matchId" value="{{ match.match_id }}">
                <select class="form-control mb-2" name="team1">
                    <option value="{{ match.team1_code }}">
                        {{ match.team1_code }}
                    </option>
                    {% for t in teams %}
                    <option value="{{ t.team_code }}">
                        {{ t.team_name }} ({{ t.team_code }})
                    </option>{% endfor %}
                </select>
                <select class="form-control mb-2" name="team2">
                    <option value="{{ match.team2_code }}">
                        {{ match.team2_code }}
                    </option>
                    {% for t in teams %}
                    <option value="{{ t.team_code }}">
                        {{ t.team_name }} ({{ t.team_code }})
                    </option>
                    {% endfor %}
                </select>
                <input class="form-control mb-2" name="venue" value="{{ match.venue }}">
                <input class="form-control mb-2" type="date" name="matchDate" value="{{ match.match_date }}">
                <input class="form-control mb-2" type="time" name="matchTime" value="{{ match.match_time }}">
                <select class="form-control mb-2" name="status">
                    <option value="upcoming" {% if match.status|lower == 'upcoming' %}selected{% endif %}>Upcoming</option>
                    <option value="running" {% if match.status|lower == 'running' %}selected{% endif %}>Running</option>
                    <option value="completed" {% if match.status|lower == 'completed' %}selected{% endif %}>Completed</option>
                </select>
                <input class="form-control mb-2" name="team1Score" value="{{ match.team1_score }}">
                <input class="form-control mb-2" name="team2Score" value="{{ match.team2_score }}">
                <select class="form-control mb-2" name="winnerCode">
                    <option value="{{ match.winner_code }}">
                        {{ match.winner_code|default:'Winner' }}
                    </option>
                    {% for t in teams %}
                    <option value="{{ t.team_code }}">
                        {{ t.team_name }} ({{ t.team_code }})
                    </option>
                    {% endfor %}
                </select>
                <input class="form-control mb-3" name="playerOfMatch" value="{{ match.player_of_match }}">
                <button class="btn btn-primary">
                    Save
                </button>
            </form>
        </div>
    </body>
</html>

<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body{background:#1a1a1a;color:#f5f5f5;font-family:'Poppins',sans-serif}
      .panel{background:#242424;border:1px solid #333;border-radius:14px}
      .form-label{font-weight:600}
    </style>
</head>
<body>
  <div class="container py-4" style="max-width:760px">
    <a href="{% url 'matches:admin_list' %}" class="btn btn-outline-light btn-sm mb-3">Back to Matches</a>
    <div class="panel p-4">
      <h2 class="mb-3">Enter Match Details</h2>
      <form method="post" action="{% url 'matches:add_action' %}">
        {% csrf_token %}
        <label class="form-label" for="matchId">Match ID</label>
        <input id="matchId" class="form-control mb-3" type="number" name="matchId" required>

        <label class="form-label" for="team1">Team 1</label>
        <select id="team1" class="form-control mb-3" name="team1" required>
          <option value="">Select Team 1</option>
          {% for t in teams %}
          <option value="{{ t.team_code }}">{{ t.team_name }} ({{ t.team_code }})</option>
          {% endfor %}
        </select>

        <label class="form-label" for="team2">Team 2</label>
        <select id="team2" class="form-control mb-3" name="team2" required>
          <option value="">Select Team 2</option>
          {% for t in teams %}
          <option value="{{ t.team_code }}">{{ t.team_name }} ({{ t.team_code }})</option>
          {% endfor %}
        </select>

        <label class="form-label" for="venue">Venue</label>
        <input id="venue" class="form-control mb-3" name="venue" required>

        <label class="form-label" for="matchDate">Match Date</label>
        <input id="matchDate" class="form-control mb-3" type="date" name="matchDate" required>

        <label class="form-label" for="matchTime">Match Time</label>
        <input id="matchTime" class="form-control mb-3" type="time" name="matchTime" required>

        <label class="form-label" for="status">Status</label>
        <select id="status" class="form-control mb-3" name="status">
          <option value="upcoming">Upcoming</option>
          <option value="running">Running</option>
          <option value="completed">Completed</option>
        </select>

        <label class="form-label" for="team1Score">Team 1 Score</label>
        <input id="team1Score" class="form-control mb-3" name="team1Score" placeholder="Optional for upcoming">

        <label class="form-label" for="team2Score">Team 2 Score</label>
        <input id="team2Score" class="form-control mb-3" name="team2Score" placeholder="Optional for upcoming">

        <label class="form-label" for="winnerCode">Winner</label>
        <select id="winnerCode" class="form-control mb-3" name="winnerCode">
          <option value="">Select Winner</option>
          {% for t in teams %}
          <option value="{{ t.team_code }}">{{ t.team_name }} ({{ t.team_code }})</option>
          {% endfor %}
        </select>

        <label class="form-label" for="playerOfMatch">Player of Match</label>
        <input id="playerOfMatch" class="form-control mb-4" name="playerOfMatch" placeholder="Optional for upcoming">

        <button class="btn btn-success">Save Match</button>
      </form>
    </div>
  </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Add Team</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
        <body class="bg-dark text-white">
            <div class="container py-5" style="max-width:700px">
                <a href="{% url 'teams:admin_dashboard' %}" class="text-white">Back</a>
                <h2 class="mt-3">Add New IPL Team</h2>
                    {% if status == 'error' %}
                    <div class="alert alert-danger">Failed to add team.</div>
                    
                    {% elif status == 'duplicate' %}
                    
                    <div class="alert alert-warning">Team already exists.</div>
                    {% endif %}
                <form action="{% url 'teams:add_team_action' %}" method="post" enctype="multipart/form-data">
                   
                    {% csrf_token %}
                    
        <div class="mb-3">
            <input type="text" class="form-control" name="teamCode" placeholder="Team Code (MI, RCB)" maxlength="3" required>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" name="teamName" placeholder="Team Name" required>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" name="country" value="India" readonly>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" name="coachName" placeholder="Coach Name" required>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control" name="captainName" placeholder="Captain Name" required>
        </div>

        <div class="mb-3">
            <input type="file" class="form-control" name="teamLogo" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-success">Add Team</button>

        </form>
        </div>
        </body>
        </html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPL Teams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg-dark:#1a1a1a;--card-dark:#242424;--text-light:#f5f5f5;--accent-orange:#ff6600}
    body{background:var(--bg-dark);color:var(--text-light);font-family:'Poppins',sans-serif}
    .navbar{background:var(--card-dark)}
    .dock-container{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
    .dock-item{transition:transform .3s ease}
    .dock-item:hover{transform:scale(1.08) translateY(-4px)}
    .dock-item a{color:var(--text-light);text-decoration:none;padding:8px 15px;border-radius:8px;background:#333}
    .dock-item a.active,.dock-item a:hover{background:var(--accent-orange);color:#fff}
    .team-card{background:#1e1e1e;border-radius:15px;overflow:hidden;box-shadow:0 0 20px rgba(0,195,255,.2);transition:transform .3s ease,box-shadow .3s ease;height:100%}
    .team-card:hover{transform:translateY(-8px);box-shadow:0 0 30px rgba(0,195,255,.35)}
    .image-wrapper{height:260px;overflow:hidden}
    .image-wrapper img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
    .team-card:hover .image-wrapper img{transform:scale(1.06)}
    .card-footer{padding:20px;background:#151515}
    .team-name{font-size:18px;font-weight:700;color:#28a745}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="{% url 'public:home' %}">IPL Management</a>
    </div>
  </nav>

  <div class="dock-container">
    <div class="dock-item"><a href="{% url 'teams:public_list' %}" class="active"><i class="fas fa-users"></i> Teams</a></div>
    <div class="dock-item"><a href="{% url 'players:public_list' %}"><i class="fas fa-user"></i> Players</a></div>
    <div class="dock-item"><a href="{% url 'matches:public_list' %}"><i class="fas fa-chart-line"></i> Matches</a></div>
  </div>

  <div class="container mt-4">
    <h2>Teams</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4 align-items-stretch">
      {% for t in teams %}
      <div class="col">
        <div class="team-card">
          <div class="image-wrapper">
            <img src="{{ t.logo_path|default:'/static/ipl.jpeg' }}" alt="Team Logo">
          </div>
          <div class="card-footer">
            <h5 class="team-name">{{ t.team_name }} ({{ t.team_code }})</h5>
            <p>
              <strong>Coach:</strong> {{ t.coach_name }}<br>
              <strong>Captain:</strong> {{ t.captain_name }}<br>
              <strong>Country:</strong> {{ t.country }}
            </p>
          </div>
        </div>
      </div>
      {% empty %}
      <div class="col"><p>No teams found.</p></div>
      {% endfor %}
    </div>
  </div>
</body>
</html>

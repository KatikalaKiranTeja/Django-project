{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Update Team</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
        <body class="bg-dark text-white">
            <div class="container py-5" style="max-width:700px">
                <a href="{% url 'teams:admin_dashboard' %}" class="text-white">Back</a>
                <h2 class="mt-3">
                    Update Team: {{ team.team_name }}
                </h2>

                <form action="{% url 'teams:update_team_action' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                        <input type="hidden" name="teamCode" value="{{ team.team_code }}">

                        <div class="mb-3">
                            <input type="text" class="form-control" name="teamName" value="{{ team.team_name }}" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" name="country" value="{{ team.country }}" readonly>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" name="coachName" value="{{ team.coach_name }}" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" name="captainName" value="{{ team.captain_name }}" required>
                        </div>
                        <div class="mb-3">
                            <img src="{{ team.logo_path|default:'/static/ipl.jpeg' }}" alt="Team Logo" style="width:120px">
                        </div>
                        <div class="mb-3">
                            <input type="file" class="form-control" name="teamLogo" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </body>
</html>
